name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets you deploy from GitHub Actions once AWS access is configured
  # (see the deploy job below).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, test and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Validate the SAM template
        run: sam validate --lint --region eu-west-1

      - name: Build the SAM application
        run: sam build

  deploy:
    name: Deploy (manual only)
    needs: quality
    # Two switches must both be on, so this can never fire by accident:
    #   * a human triggers the workflow, and
    #   * the repository variable ENABLE_DEPLOY is set to "true".
    if: github.event_name == 'workflow_dispatch' && vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    # Requires an OIDC role with deploy permissions, exposed as the repository
    # secret AWS_DEPLOY_ROLE_ARN.  No long-lived keys are stored.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Build
        run: sam build

      - name: Deploy
        run: sam deploy --no-confirm-changeset --no-fail-on-empty-changeset